services:
  - type: web
    name: donow-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard from your Neon Connection String
      - key: JWT_SECRET
        generateValue: true
